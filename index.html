<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>売上精算アプリ — ファンシーフラワー パル店</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Meiryo', 'Yu Gothic', sans-serif; background: #f0f4f8; color: #222; min-height: 100vh; }

  .header { background: #1a2e4a; color: #fff; padding: 14px 20px; font-size: 15px; font-weight: bold; text-align: center; }

  .content { padding: 16px; max-width: 480px; margin: 0 auto; }

  .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }

  .section-title { font-size: 13px; font-weight: bold; color: #1a2e4a; margin-bottom: 14px; border-left: 4px solid #1a2e4a; padding-left: 8px; }

  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 12px; color: #555; font-weight: bold; margin-bottom: 5px; }
  .field input {
    width: 100%; padding: 12px 14px; border: 1px solid #ccd; border-radius: 6px;
    font-size: 20px; text-align: right; font-family: inherit; background: #fafbff;
  }
  .field input[type="date"] { text-align: left; font-size: 15px; }
  .field input:focus { outline: none; border-color: #4a6fa5; box-shadow: 0 0 0 2px rgba(74,111,165,0.2); background: #fff; }
  .field .hint { font-size: 11px; color: #aaa; margin-top: 4px; }

  .total-bar {
    background: #eef2ff; border-radius: 8px; padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: center; margin-top: 14px;
  }
  .total-bar .lbl { font-size: 13px; font-weight: bold; color: #1a2e4a; }
  .total-bar .val { font-size: 24px; font-weight: bold; color: #1a2e4a; }

  .btn-confirm {
    width: 100%; padding: 16px; background: #2e7d32; color: #fff;
    border: none; border-radius: 8px; font-size: 17px; font-weight: bold;
    font-family: inherit; cursor: pointer; letter-spacing: 1px;
  }
  .btn-confirm:hover { background: #1b5e20; }
  .btn-confirm:disabled { background: #aaa; cursor: not-allowed; }

  .error-msg { background: #fce4e4; color: #c62828; border-radius: 8px; padding: 12px 16px; font-size: 13px; margin-bottom: 14px; display: none; }

  /* 結果画面 */
  .result-header { text-align: center; padding: 16px; background: #e8f5e9; border-radius: 10px; margin-bottom: 14px; }
  .result-header .check { font-size: 40px; }
  .result-header .msg { font-size: 15px; font-weight: bold; color: #2e7d32; margin-top: 4px; }
  .result-header .date { font-size: 13px; color: #555; margin-top: 4px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { background: #1a2e4a; color: #fff; padding: 8px 10px; text-align: center; font-weight: bold; }
  td { padding: 8px 10px; border: 1px solid #dde; text-align: right; }
  td.lbl { text-align: center; font-weight: bold; font-size: 13px; }
  tr:nth-child(even) td { background: #f7f9fc; }
  .row-hassuu td { background: #fffbe6 !important; color: #856404; font-weight: bold; }
  .row-total td { background: #eef2ff !important; font-weight: bold; }

  .btn-next {
    width: 100%; padding: 14px; background: #4a6fa5; color: #fff;
    border: none; border-radius: 8px; font-size: 15px; font-weight: bold;
    font-family: inherit; cursor: pointer; margin-top: 14px;
  }
  .btn-next:hover { background: #3a5a90; }

  .view { display: none; }
  .view.active { display: block; }

  .saving-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.85);
    align-items: center; justify-content: center;
    font-size: 16px; font-weight: bold; color: #1a2e4a;
    z-index: 100;
  }
</style>
</head>
<body>

<div class="header">売上精算アプリ — ファンシーフラワー パル店</div>

<div class="saving-overlay" id="saving-overlay" style="display:none">保存中...</div>

<!-- ── 入力画面 ── -->
<div class="view active" id="view-input">
  <div class="content">

    <div class="card">
      <div class="section-title">日付</div>
      <div class="field">
        <input type="date" id="input-date">
      </div>
    </div>

    <div class="card">
      <div class="section-title">税込売上（円）</div>
      <div class="field">
        <label>現金売上</label>
        <input type="number" id="input-genkin" placeholder="0" inputmode="numeric" oninput="updateTotal()">
      </div>
      <div class="field">
        <label>クレジット売上</label>
        <input type="number" id="input-credit" placeholder="0" inputmode="numeric" oninput="updateTotal()">
      </div>
      <div class="field">
        <label>QR決済（PayPay）</label>
        <input type="number" id="input-qr" placeholder="0" inputmode="numeric" oninput="updateTotal()">
      </div>
      <div class="total-bar">
        <span class="lbl">合計</span>
        <span class="val" id="display-total">0 円</span>
      </div>
    </div>

    <div class="card">
      <div class="section-title">客数（任意）</div>
      <div class="field">
        <input type="number" id="input-customers" placeholder="人数を入力" inputmode="numeric">
        <div class="hint">入力しない場合は空白でOK</div>
      </div>
    </div>

    <div id="error-msg" class="error-msg"></div>

    <button class="btn-confirm" onclick="confirmSave()">確定して保存</button>

  </div>
</div>

<!-- ── 転記用データ表示 ── -->
<div class="view" id="view-result">
  <div class="content">

    <div class="result-header">
      <div class="check">✅</div>
      <div class="msg">保存完了</div>
      <div class="date" id="result-date"></div>
    </div>

    <div class="card">
      <div class="section-title">本日合計（税込）</div>
      <table>
        <thead><tr><th>現金</th><th>クレジット</th><th>QR</th><th>合計</th></tr></thead>
        <tbody>
          <tr>
            <td id="r-genkin"></td>
            <td id="r-credit"></td>
            <td id="r-qr"></td>
            <td id="r-total"></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="card">
      <div class="section-title">転記用セクション</div>
      <p style="font-size:11px;color:#aaa;margin-bottom:10px;">伝票への手書き転記にご利用ください</p>
      <table>
        <thead>
          <tr><th>支払区分</th><th>原単価</th><th>売単価</th><th>税込</th></tr>
        </thead>
        <tbody id="result-tenki"></tbody>
      </table>
    </div>

    <button class="btn-next" onclick="goToNext()">次の日の入力へ</button>

  </div>
</div>

<script>
// ──────────────────────────────────────────────
// Supabase設定
// ──────────────────────────────────────────────
const SUPABASE_URL = 'https://vvyzwwoduaqqamjvoqrp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2eXp3d29kdWFxcWFtanZvcXJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTk1MzMsImV4cCI6MjA5NTM5NTUzM30.aKE-ZUjXJ0j3iBMQP1GLpfwwzPWGJFglhJa0vB52Q-U';  // ← ここを差し替える

async function sbFetch(path, opts = {}) {
  const res = await fetch(SUPABASE_URL + path, {
    ...opts,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
      ...(opts.headers || {})
    }
  });
  if (!res.ok) throw new Error(await res.text());
  const txt = await res.text();
  return txt ? JSON.parse(txt) : [];
}

// ──────────────────────────────────────────────
// 計算ロジック（検証アプリと同一）
// ──────────────────────────────────────────────
function intfloor(v) { return Math.floor(v); }

function costPrice(D) {
  if (!D || D <= 0) return null;
  const num = D * 835;
  const q = Math.floor(num / 1000);
  const r = num % 1000;
  if (r > 500) return q + 1;
  if (r < 500) return q;
  return q % 2 === 0 ? q : q + 1;
}

function calcD(E) {
  if (!E || E <= 0) return null;
  const up = Math.ceil(E / 1.1);
  return (intfloor(up * 1.1) === E) ? up : up - 1;
}

function compute(E8, E9, E10) {
  const E11 = E8 + E9 + E10;
  const D9 = calcD(E9), D10 = calcD(E10), D11 = calcD(E11);
  const C9 = D9 !== null ? costPrice(D9) : null;
  const C10 = D10 !== null ? costPrice(D10) : null;

  const gH = (E8 > 0)  && (intfloor(Math.ceil(E8/1.1)*1.1)  !== E8);
  const cH = (E9 > 0)  && (intfloor(Math.ceil(E9/1.1)*1.1)  !== E9);
  const qH = (E10 > 0) && (intfloor(Math.ceil(E10/1.1)*1.1) !== E10);
  const tH = D11 !== null && intfloor(D11*1.1) !== E11;
  const tAdj = ((gH || cH || qH) && tH) ? 1 : 0;
  const has3 = E8 > 0 && E9 > 0 && E10 > 0;

  const showG = gH && !has3;
  const showC = cH && !has3;
  const showQ = qH && !has3;

  const D31 = E11 > 0 ? D11 + tAdj : null;
  const C31 = D31 !== null ? costPrice(D31) : null;

  const C27 = E8 > 0 ? C31-(showG?1:0)-(C9||0)-(showC?1:0)-(C10||0)-(showQ?1:0) : null;
  const D27 = E8 > 0 ? D31-(showG?1:0)-(D9||0)-(showC?1:0)-(D10||0)-(showQ?1:0) : null;
  const E27 = E8 > 0 ? (showG ? E8-1 : E8) : null;
  const E29 = showC ? (D9!==null?intfloor(D9*1.1):null) : (E9>0?E9:null);
  const E30 = showQ ? (D10!==null?intfloor(D10*1.1):null) : (E10>0?E10:null);

  const rows = [];
  if (E8>0)   rows.push({cls:'',           lbl:'現金分',             c:C27, d:D27, e:E27});
  if (showG)  rows.push({cls:'row-hassuu',  lbl:'現金（端数）',       c:1,   d:1,   e:1  });
  if (E9>0)   rows.push({cls:'',           lbl:'クレジット支払分',   c:C9,  d:D9,  e:E29});
  if (showC)  rows.push({cls:'row-hassuu',  lbl:'クレジット（端数）', c:1,   d:1,   e:1  });
  if (E10>0)  rows.push({cls:'',           lbl:'PayPay支払分',       c:C10, d:D10, e:E30});
  if (showQ)  rows.push({cls:'row-hassuu',  lbl:'QR（端数）',         c:1,   d:1,   e:1  });
  rows.push(            {cls:'row-total',   lbl:'合計',               c:C31, d:D31, e:E11>0?E11:null});

  return { rows, E11 };
}

// ──────────────────────────────────────────────
// UIヘルパー
// ──────────────────────────────────────────────
function fmt(v) {
  if (v === null || v === undefined) return '';
  return Number(v).toLocaleString('ja-JP');
}

function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

function updateTotal() {
  const E8  = Number(document.getElementById('input-genkin').value) || 0;
  const E9  = Number(document.getElementById('input-credit').value) || 0;
  const E10 = Number(document.getElementById('input-qr').value)     || 0;
  document.getElementById('display-total').textContent = fmt(E8+E9+E10) + ' 円';
}

// ──────────────────────────────────────────────
// 確定・保存
// ──────────────────────────────────────────────
async function confirmSave() {
  showError('');
  const payment_date   = document.getElementById('input-date').value;
  const E8  = Number(document.getElementById('input-genkin').value)   || 0;
  const E9  = Number(document.getElementById('input-credit').value)   || 0;
  const E10 = Number(document.getElementById('input-qr').value)       || 0;
  const cust = document.getElementById('input-customers').value;

  if (!payment_date)       { showError('日付を入力してください'); return; }
  if (E8+E9+E10 === 0)     { showError('売上金額を1つ以上入力してください'); return; }

  const btn = document.querySelector('.btn-confirm');
  btn.disabled = true;
  document.getElementById('saving-overlay').style.display = 'flex';

  try {
    await sbFetch('/rest/v1/daily_payments', {
      method: 'POST',
      body: JSON.stringify({
        payment_date,
        genkin: E8,
        credit: E9,
        qr: E10,
        customer_count: cust ? Number(cust) : null,
        source_type: 'manual'
      })
    });
    showResult(payment_date, E8, E9, E10);
  } catch(e) {
    showError('保存に失敗しました: ' + e.message);
    btn.disabled = false;
  } finally {
    document.getElementById('saving-overlay').style.display = 'none';
  }
}

// ──────────────────────────────────────────────
// 結果表示
// ──────────────────────────────────────────────
function showResult(payment_date, E8, E9, E10) {
  const d = new Date(payment_date + 'T00:00:00');
  document.getElementById('result-date').textContent =
    d.toLocaleDateString('ja-JP', {year:'numeric', month:'long', day:'numeric', weekday:'short'});

  document.getElementById('r-genkin').textContent = E8  > 0 ? fmt(E8)  + '円' : '—';
  document.getElementById('r-credit').textContent = E9  > 0 ? fmt(E9)  + '円' : '—';
  document.getElementById('r-qr').textContent     = E10 > 0 ? fmt(E10) + '円' : '—';
  document.getElementById('r-total').textContent  = fmt(E8+E9+E10) + '円';

  const { rows } = compute(E8, E9, E10);
  document.getElementById('result-tenki').innerHTML = rows.map(r =>
    `<tr class="${r.cls}">
      <td class="lbl">${r.lbl}</td>
      <td>${fmt(r.c)}</td>
      <td>${fmt(r.d)}</td>
      <td>${fmt(r.e)}</td>
    </tr>`
  ).join('');

  showView('view-result');
}

// ──────────────────────────────────────────────
// 次の日へ
// ──────────────────────────────────────────────
function goToNext() {
  const currentDate = document.getElementById('input-date').value;
  document.getElementById('input-genkin').value   = '';
  document.getElementById('input-credit').value   = '';
  document.getElementById('input-qr').value       = '';
  document.getElementById('input-customers').value = '';
  updateTotal();
  showError('');
  document.querySelector('.btn-confirm').disabled = false;

  if (currentDate) {
    const next = new Date(currentDate + 'T00:00:00');
    next.setDate(next.getDate() + 1);
    document.getElementById('input-date').value = next.toLocaleDateString('sv-SE');
  }

  showView('view-input');
}

// ──────────────────────────────────────────────
// 初期化
// ──────────────────────────────────────────────
document.getElementById('input-date').value = new Date().toLocaleDateString('sv-SE');
</script>
</body>
</html>
